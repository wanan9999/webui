name: 构建并发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要创建并发布的 Git 标签，例如 v1.0.9'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: 构建并发布前端
    runs-on: ubuntu-latest

    steps:
      - name: 检出 main 分支代码
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查 TypeScript 类型
        run: npm run typecheck

      - name: 检查代码规范
        run: npx eslint src/

      - name: 运行测试
        run: npx vitest run

      - name: 构建前端
        run: npm run build

      - name: 创建 webui.zip
        working-directory: dist
        run: zip -r ../webui.zip .

      - name: 生成发布说明
        run: |
          awk '/^## \[/{c++} c==1' CHANGELOG.md > release_body.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          files: webui.zip
          body_path: release_body.md
          tag_name: ${{ inputs.tag }}
          target_commitish: main
